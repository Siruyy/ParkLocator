version: "3.9"

services:
  db:
    image: postgis/postgis:16-3.5
    platform: linux/amd64
    container_name: parklocator-db
    environment:
      POSTGRES_USER: parklocator
      POSTGRES_PASSWORD: parklocator
      POSTGRES_DB: parklocator
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parklocator -d parklocator"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  db_data:
