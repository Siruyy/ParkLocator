<div class="flex h-screen bg-gray-50">
  <app-sidebar></app-sidebar>

  <div class="flex-1 flex flex-col overflow-hidden">
    <app-header title="System Logs"></app-header>

    <main class="flex-1 overflow-x-hidden overflow-y-auto bg-gray-50 p-6">
      <div class="bg-white rounded-lg shadow p-6">
        <h3 class="text-lg font-semibold text-gray-700 mb-4">Activity Log</h3>
        
        <p-table 
          [value]="logs" 
          [lazy]="true" 
          (onLazyLoad)="loadLogs($event)"
          [paginator]="true" 
          [rows]="pageSize" 
          [totalRecords]="totalRecords" 
          [loading]="loading"
          [tableStyle]="{ 'min-width': '50rem' }">
          <ng-template pTemplate="header">
            <tr>
              <th>Timestamp</th>
              <th>Action</th>
              <th>Details</th>
              <th>User</th>
              <th>Status</th>
            </tr>
          </ng-template>
          <ng-template pTemplate="body" let-log>
            <tr>
              <td>{{ log.timestamp | date:'medium' }}</td>
              <td class="font-semibold">{{ log.action }}</td>
              <td>{{ log.details }}</td>
              <td>{{ log.user }}</td>
              <td>
                <p-tag [value]="log.status | uppercase" [severity]="getSeverity(log.status)"></p-tag>
              </td>
            </tr>
          </ng-template>
        </p-table>
      </div>
    </main>
  </div>
</div>
