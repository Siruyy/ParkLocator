<aside class="hidden lg:flex w-72 flex-col h-full bg-surface-light dark:bg-surface-dark border-r border-gray-100 dark:border-gray-800 transition-colors duration-300 z-20 shadow-soft">
    <div class="p-6 flex flex-col h-full">
        <div class="flex items-center gap-3 mb-8 px-2">
            <img src="assets/images/logo2.png" alt="Parking Boy" class="size-10 rounded-xl object-contain" />
            <div class="flex flex-col">
                <h1 class="text-lg font-bold leading-none tracking-tight">Parking Boy</h1>
                <p class="text-text-secondary-light dark:text-text-secondary-dark text-xs font-medium mt-1">{{ portalTitle() }}</p>
            </div>
        </div>
        <nav class="flex-1 flex flex-col gap-2">
            <a *ngFor="let item of filteredMenuItems()" 
               [routerLink]="item.route"
               routerLinkActive="bg-primary/20 text-black dark:text-white dark:bg-primary/20 font-semibold"
               [routerLinkActiveOptions]="{exact: false}"
               class="group flex items-center gap-3 px-4 py-3 rounded-full text-text-secondary-light dark:text-text-secondary-dark hover:bg-gray-100 dark:hover:bg-white/5 hover:translate-x-1 active:scale-[0.98] transition-all duration-200 cursor-pointer">
                <span class="material-symbols-outlined group-hover:scale-110 transition-transform duration-200" [class.filled-icon]="false">{{ item.icon }}</span>
                <span class="text-sm font-medium group-hover:text-text-primary-light dark:group-hover:text-text-primary-dark">{{ item.label }}</span>
                <span *ngIf="item.badge" class="ml-auto bg-accent-error/10 text-accent-error text-[10px] font-bold px-2 py-0.5 rounded-full animate-pulse">{{ item.badge }}</span>
            </a>
        </nav>
        <div class="mt-auto flex flex-col gap-4">
            <button (click)="logout()" 
               class="group flex items-center gap-3 px-4 py-3 rounded-full text-text-secondary-light dark:text-text-secondary-dark hover:bg-accent-error/10 hover:text-accent-error hover:translate-x-1 active:scale-[0.98] transition-all duration-200 cursor-pointer w-full">
                <span class="material-symbols-outlined group-hover:scale-110 transition-transform duration-200">logout</span>
                <span class="text-sm font-medium">Logout</span>
            </button>

            <div class="px-4 py-3 rounded-2xl bg-gray-50 dark:bg-white/5 border border-gray-100 dark:border-gray-700">
                <div class="flex items-center gap-2 mb-2">
                    <span class="relative flex h-2.5 w-2.5">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-accent-success opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-accent-success"></span>
                    </span>
                    <span class="text-xs font-semibold text-text-primary-light dark:text-text-primary-dark">System Live</span>
                </div>
                <p class="text-[10px] text-text-secondary-light dark:text-text-secondary-dark leading-tight">Syncing data every 30s. Last sync: Just now.</p>
            </div>
            <div class="flex items-center gap-2 px-4 text-text-secondary-light dark:text-text-secondary-dark opacity-60 hover:opacity-100 transition-opacity">
                <span class="material-symbols-outlined text-[18px]">info</span>
                <span class="text-xs">v1.0.2 Beta</span>
            </div>
        </div>
    </div>
</aside>
